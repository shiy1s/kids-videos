name: ONE TIME Kids Upload Test

on:
  push:
    paths:
      - ".github/workflows/one-time-kids-upload-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install pillow google-api-python-client google-auth google-auth-httplib2
      - name: Generate and render
        run: |
          set -euo pipefail
          mkdir -p worker/output
          python scripts/generate/create_daily_job.py --output worker/job.json
          python scripts/generate/run_media_worker.py --job-json worker/job.json --output-dir worker/output
          python scripts/qc/validate_media.py worker/output/artifacts/kids-video.mp4
      - name: Upload private test video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          python scripts/publish/upload_youtube.py             --video worker/output/artifacts/kids-video.mp4             --title "Kids Automation Test - Milo and Pip"             --description "Private end-to-end automation test. Original child-directed cartoon."
