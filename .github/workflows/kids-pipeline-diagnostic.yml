name: Kids Pipeline Diagnostic

on:
  push:
    paths:
      - ".github/workflows/kids-pipeline-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        id: deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install pillow google-api-python-client google-auth google-auth-httplib2

      - name: Generate, render, and QC
        id: media
        run: |
          set -euo pipefail
          mkdir -p worker/output
          python scripts/generate/create_daily_job.py --output worker/job.json
          python scripts/generate/run_media_worker.py --job-json worker/job.json --output-dir worker/output
          python scripts/qc/validate_media.py worker/output/artifacts/kids-video.mp4
          test -s worker/output/artifacts/kids-video.mp4

      - name: YouTube OAuth and upload
        id: youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          python scripts/publish/upload_youtube.py             --video worker/output/artifacts/kids-video.mp4             --title "Kids Pipeline Diagnostic - Milo and Pip"             --description "Private diagnostic upload for the automated Kids Video pipeline."

      - name: Record diagnostic result
        if: ${{ always() }}
        env:
          DEPS: ${{ steps.deps.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          YOUTUBE: ${{ steps.youtube.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          result = {
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ.get("GITHUB_SHA"),
              "dependencies": os.environ.get("DEPS"),
              "mediaRenderAndQc": os.environ.get("MEDIA"),
              "youtubeUpload": os.environ.get("YOUTUBE"),
          }
          p=Path("state/kids_pipeline_diagnostic.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/kids_pipeline_diagnostic.json
          git commit -m "Record Kids pipeline diagnostic" || true
          git push
