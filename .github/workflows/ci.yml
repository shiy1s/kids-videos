name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Verify studio contract and repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f STUDIO_BRIEF.md
          test -f episode_log.json
          test -f quality_review_template.json
          test -f characters/character_bible.md
          test -f scripts/generate/run_media_worker.py
          test -f scripts/generate/procedural_assets.py
          test -f scripts/render/render_ffmpeg.py
          test -f scripts/qc/validate_media.py
          test -f scripts/qc/quality_gate.py
          test -f scripts/publish/upload_youtube.py
          python -m json.tool episode_log.json >/dev/null
          python -m json.tool quality_review_template.json >/dev/null
          python -m json.tool config/content_policy.json >/dev/null
          echo "Studio contract and repository structure OK"

      - name: Verify empty review template is blocked
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/qc/quality_gate.py quality_review_template.json; then
            echo "ERROR: an unreviewed template must never pass."
            exit 1
          fi
          echo "Unreviewed release correctly blocked."

      - name: Test episode history and release safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run media pipeline without YouTube upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-worker
          python scripts/generate/create_daily_job.py --output ci-worker/job.json
          python scripts/qc/validate_job.py ci-worker/job.json
          python scripts/generate/run_media_worker.py \
            --job-json ci-worker/job.json \
            --output-dir ci-worker/output
          test -s ci-worker/output/artifacts/kids-video.mp4
          python scripts/qc/validate_media.py ci-worker/output/artifacts/kids-video.mp4

      - name: Upload CI video artifact
        uses: actions/upload-artifact@v7
        with:
          name: kids-video-ci-${{ github.run_id }}
          path: ci-worker/output/artifacts/kids-video.mp4
          retention-days: 1
