name: Daily Kids Video Pipeline

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

run-name: Kids Daily Video

permissions:
  contents: read

concurrency:
  group: kids-daily-pipeline
  cancel-in-progress: false

jobs:
  generate-render-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install media and YouTube dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install pillow google-api-python-client google-auth google-auth-httplib2

      - name: Create daily job
        run: |
          set -euo pipefail
          mkdir -p worker
          python scripts/generate/create_daily_job.py --output worker/job.json
          cat worker/job.json

      - name: Generate, render, and QC
        run: |
          set -euo pipefail
          mkdir -p worker/output
          python scripts/generate/run_media_worker.py --job-json worker/job.json --output-dir worker/output
          test -s worker/output/artifacts/kids-video.mp4

      - name: Keep rendered video as a short-lived debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: kids-video-${{ github.run_id }}
          path: worker/output/artifacts/kids-video.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Upload publicly to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          TITLE="$(python - <<'PY'
          import json
          print(json.load(open("worker/job.json", encoding="utf-8"))["content"]["title"])
          PY
          )"
          DESCRIPTION="$(python - <<'PY'
          import json
          j=json.load(open("worker/job.json", encoding="utf-8"))
          print(j["content"]["story"] + "\n\nOriginal child-directed cartoon.\nJob ID: " + j["jobId"])
          PY
          )"
          python scripts/publish/upload_youtube.py --video worker/output/artifacts/kids-video.mp4 --title "$TITLE" --description "$DESCRIPTION" > worker/youtube_result.json
          cat worker/youtube_result.json

      - name: Verify YouTube response
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("worker/youtube_result.json").read_text(encoding="utf-8"))
          assert r.get("status") == "success", r
          assert r.get("youtubeVideoId"), r
          assert r.get("privacyStatus") == "public", r
          assert r.get("madeForKids") is True, r
          print("YOUTUBE_PUBLIC_UPLOAD_VERIFIED", r["youtubeVideoId"])
          PY
