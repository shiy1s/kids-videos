name: Daily Kids Video Pipeline

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

run-name: Kids Daily Video

permissions:
  contents: read

concurrency:
  group: kids-daily-pipeline
  cancel-in-progress: false

jobs:
  generate-render-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install media and YouTube dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install pillow google-api-python-client google-auth google-auth-httplib2

      - name: Create daily job
        run: |
          set -euo pipefail
          mkdir -p worker
          python scripts/generate/create_daily_job.py --output worker/job.json
          cat worker/job.json

      - name: Generate, render, and QC
        run: |
          set -euo pipefail
          mkdir -p worker/output
          python scripts/generate/run_media_worker.py --job-json worker/job.json --output-dir worker/output
          test -s worker/output/artifacts/kids-video.mp4

      - name: Keep rendered video as a short-lived debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: kids-video-${{ github.run_id }}
          path: worker/output/artifacts/kids-video.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Quality gate — hold publishing until animation upgrade is approved
        run: |
          set -euo pipefail
          echo "RENDER_ONLY_MODE: generated video is available as a GitHub artifact."
          echo "Public publishing is intentionally paused while the low-quality procedural visuals and synthetic narration are replaced."
          echo "No video was uploaded by this workflow."
